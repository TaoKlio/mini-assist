miniassist.settings = Mini Assist

setting.miniassist-drill.name = Drill output
setting.miniassist-drill.description = Hold a key and drag to list net and actual output per item at the selection's top-left corner.
setting.drilloutput-key.name = Selection Key
setting.drilloutput-key.description = Key name to hold for selecting an area, e.g. f, g, r, mouseMiddle.
setting.drilloutput-enabled.name = Enable
setting.drilloutput-enabled.description = Whether the drill output overlay is active.
setting.drilloutput-own-team.name = Own team only
setting.drilloutput-own-team.description = When on, only drills of your current team are counted; enemy and neutral (derelict) drills are ignored. Turn off to count every drill in the selection. On by default.
setting.drilloutput-net-note.name = Net output
setting.drilloutput-net-note.description = Net output counts the water boost but never overdrive. The two options below decide which stalled drills still count toward it.
setting.drilloutput-net-nopower.name = Include unpowered drills
setting.drilloutput-net-nopower.description = When on, drills with no power (power efficiency 0) still contribute their theoretical maximum to net output.
setting.drilloutput-net-full.name = Include full drills
setting.drilloutput-net-full.description = When on, drills whose item capacity is full still contribute their theoretical maximum to net output.
setting.drilloutput-outline.name = Text outline
setting.drilloutput-outline.description = Draw a dark outline around the text for readability. Turn off if the text looks blurry or haloed.
setting.drilloutput-box.name = Selection box border
setting.drilloutput-box.description = Draw the rectangle border while selecting. Off by default; independent of the size text option.
setting.drilloutput-area-hint.name = Selection size text
setting.drilloutput-area-hint.description = Show the selection size (plus the clamp notice) as the first line inside the box. On by default.
setting.drilloutput-max-side.name = Max selection side
setting.drilloutput-max-side.description = How many tiles per side are counted at most; anything beyond is clamped and reported. Cost grows with area, so a large value may cost frames on big maps.
setting.drilloutput-average.name = Average values
setting.drilloutput-average.description = Chooses the "actual" metric: on = time average (real output / elapsed time, downtime included); off = instantaneous rate (same as the game's drill speed bar, downtime not averaged in, higher but jumpier).
setting.drilloutput-average-n.name = Average window (refreshes)
setting.drilloutput-average-n.description = How many refreshes to average before the displayed value updates (each refresh is about 0.1 s). Default 30 ≈ 3 s, matching long-run metrics such as downstream consumption.
setting.miniassist-memory.name = Memory access
setting.miniassist-memory.description = Hover a memory cell for Read/Write icons: read copies it to the clipboard, write pastes numbers back into the number slots. Single-player only.
setting.memacc-maxlength.name = Max Copy Length
setting.memacc-maxlength.description = Maximum memory cell size (in slots) that can be copied. Larger cells will fail to copy.

drilloutput.values = net {0}/s   actual {1}/s
drilloutput.area = Area {0}x{1} tiles{2}
drilloutput.area-clamped = (clamped from {0}x{1})
drilloutput.other-team = ({0} other-team drills ignored)
drilloutput.side-value = {0} tiles
memoryaccess.copied = Copied memory block
memoryaccess.copy-fail = Copy failed: cell size {0} exceeds limit {1}
memoryaccess.wrote = Wrote {0} entries
memoryaccess.parse-fail = Parse failed
