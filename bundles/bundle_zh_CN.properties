miniassist.settings = mini辅助

setting.miniassist-drill.name = 钻机产出
setting.miniassist-drill.description = 按住按键框选，在选区左上角逐行显示框内各矿物的净输出与实际产出。
setting.drilloutput-key.name = 选区按键
setting.drilloutput-key.description = 按住后开始框选的按键名，例如 f、g、r、mouseMiddle。
setting.drilloutput-enabled.name = 启用
setting.drilloutput-enabled.description = 是否启用钻机产出悬浮统计。
setting.drilloutput-own-team.name = 只统计己方钻机
setting.drilloutput-own-team.description = 开启时只统计当前玩家队伍的钻机，敌队与中立（废墟）钻机都不计入；关闭则统计框内所有队伍的钻机。默认开启。
setting.drilloutput-net-note.name = 净输出
setting.drilloutput-net-note.description = 净输出指的是计算水、不计算超速的输出。下面两项决定哪些停机的钻机也计入净输出。
setting.drilloutput-net-nopower.name = 计入电力未连接的钻机
setting.drilloutput-net-nopower.description = 开启时，未接电（电力效率为 0）的钻机也按其理论最大产出计入净输出；关闭则不计入。
setting.drilloutput-net-full.name = 计入容量已满的钻机
setting.drilloutput-net-full.description = 开启时，产物已满仓的钻机也按其理论最大产出计入净输出；关闭则不计入。
setting.drilloutput-outline.name = 文字描边
setting.drilloutput-outline.description = 给文字加一圈深色描边以便看清。若文字出现光晕或发糊请关闭。
setting.drilloutput-box.name = 选区边框
setting.drilloutput-box.description = 框选时绘制矩形边框。默认关闭，界面更干净；与「选区范围文字」互不影响。
setting.drilloutput-area-hint.name = 选区范围文字
setting.drilloutput-area-hint.description = 在选区内部第一行显示选区尺寸（如「选区 8x6 格」与截断提示）。默认开启。
setting.drilloutput-max-side.name = 选区边长上限
setting.drilloutput-max-side.description = 单边最多统计多少格，超出部分截断并提示。遍历量按面积增长，调大在大地图上可能掉帧。
setting.drilloutput-average.name = 取平均值
setting.drilloutput-average.description = 决定「实际」的口径：开启＝时间平均（真实产出 ÷ 累计时间，停机时间也摊进去）；关闭＝瞬时速率（与游戏「钻取速度」条同口径，不摊停机时间，读数更高但会跳）。
setting.drilloutput-average-n.name = 平均窗口（次统计）
setting.drilloutput-average-n.description = 累计多少次统计后再刷新显示值（每次统计间隔约 0.1 秒）。默认 30 次 ≈ 3 秒，便于和「下游消耗」这种长周期量对照。
setting.miniassist-memory.name = 内存块读写
setting.miniassist-memory.description = 悬停内存块出现读/写图标：读=整块复制到剪贴板，写=从剪贴板写回数字槽。仅单机可用。
setting.memacc-maxlength.name = 最大复制长度
setting.memacc-maxlength.description = 允许复制的内存块最大长度（槽位数）。超过此值复制会失败。

drilloutput.values = 净 {0}/s   实际 {1}/s
drilloutput.area = 选区 {0}x{1} 格{2}
drilloutput.area-clamped = （已从 {0}x{1} 截断）
drilloutput.other-team = （已忽略他队 {0} 台）
drilloutput.side-value = {0} 格
memoryaccess.copied = 已复制内存块内容
memoryaccess.copy-fail = 复制失败：内存块长度 {0} 超过上限 {1}
memoryaccess.wrote = 已写入 {0} 项
memoryaccess.parse-fail = 解析失败
